# Кроссплатформенный CI (docs/stages/m0-spikes.md, раздел «M0.4»). Действия закреплены по SHA
# (тег — в комментарии); компилятор закреплён версией. Поставка и аудит зависимостей — supply.yml.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # scripts/cargo.mjs и dev.mjs наследуют окружение — sccache подхватывается и через npm-скрипты.
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: alef.exe
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            bin: alef
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bin: alef
          - name: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bin: alef
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      # Компилятор закреплён: «stable» менялся бы между запусками. Менять версию — осознанно,
      # одной правкой (и в supply.yml нижняя граница проверяется отдельно).
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch on 2026-10-11
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ matrix.name }}-${{ hashFiles('backend/Cargo.lock') }}

      - name: Cache backend/target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: backend/target
          key: cargo-target-${{ matrix.name }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            cargo-target-${{ matrix.name }}-

      - uses: mozilla-actions/sccache-action@054db53350805f83040bf3e6e9b8cf5a139aa7c9 # v0.0.7

      # The Actions cache service has outages (the first run died on `sccache: error: Server startup
      # failed`): the cache is an optimisation, so build with plain rustc when it cannot start.
      - name: sccache health check
        shell: bash
        run: |
          if ! sccache --start-server; then
            echo "::warning::sccache cannot start (cache service down); building without it"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi

      # Windows: MSVC/SDK — окружение через msvc-dev-cmd; LLVM — libclang для bindgen (mozjs_sys).
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'

      - name: Servo build prerequisites (Windows)
        if: runner.os == 'Windows'
        run: choco install --no-progress -y llvm cmake ninja

      - name: Servo build prerequisites (macOS)
        if: runner.os == 'macOS'
        run: |
          xcode-select -p
          brew install cmake ninja

      # Обоснование каждого пакета по крейтам — docs/stages/m0-results/ci.md.
      - name: Servo build prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev cmake ninja-build pkg-config \
            build-essential python3 curl git \
            libfontconfig1-dev libfreetype-dev \
            libx11-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libegl1-mesa-dev libgl1-mesa-dev \
            libx11-6 libxcb1 libxcursor1 libxrandr2 libxi6 \
            libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 \
            libegl1 libgl1 libglx-mesa0 libgl1-mesa-dri \
            libfontconfig1 libfreetype6 \
            xvfb openbox

      - name: npm ci
        run: npm ci

      - name: Lint (oxlint + структура)
        run: |
          npm run lint
          npm run lint:structure

      - name: Rust tests
        run: npm run test:rust

      # The system clipboard and trash against the real desktop of the clean runner. They change what
      # a user has, so the tests run only on request (ALEF_TEST_DESKTOP=1); Linux needs a display.
      # The default shell stays: Git Bash on Windows puts its own link.exe before the MSVC one.
      - name: Desktop backends (clipboard, trash, secrets)
        if: runner.os != 'Linux'
        env:
          ALEF_TEST_DESKTOP: "1"
        run: node scripts/cargo.mjs test --locked -p alef-modules --test system --test desktop --test data -- --ignored --nocapture

      - name: Desktop backends (clipboard, trash; virtual display)
        if: runner.os == 'Linux'
        env:
          ALEF_TEST_DESKTOP: "1"
        run: xvfb-run -a node scripts/cargo.mjs test --locked -p alef-modules --test system --test desktop -- --ignored --nocapture

      # The Secret Service needs a session bus and a keyring daemon with its default collection unlocked.
      - name: Desktop backends (secrets; keyring of a session)
        if: runner.os == 'Linux'
        env:
          ALEF_TEST_DESKTOP: "1"
        run: |
          sudo apt-get install -y --no-install-recommends gnome-keyring
          dbus-run-session -- bash -c 'echo -n "alef-ci" | gnome-keyring-daemon --unlock --components=secrets > /dev/null && node scripts/cargo.mjs test --locked -p alef-modules --test data -- --ignored --nocapture'

      - name: Generated TypeScript types
        run: |
          npm run check:types
          npm run test:types

      - name: "@alef-tron/api tests"
        run: npm run test:api

      - name: "@alef-tron/mcp tests"
        run: npm run test:mcp

      - name: "@alef-tron/tools tests"
        run: npm run test:tools

      # Typecheck ровно один раз — внутри полного билда на Linux (build:frontend запускает tsc).
      - name: Build (Rust, без frontend)
        if: runner.os != 'Linux'
        run: npm run build:rust

      - name: Build (typecheck + frontend + Rust)
        if: runner.os == 'Linux'
        run: npm run build

      # tests/e2e: the real alef binary on scenario applications; Servo renders through Mesa software GL.
      - name: e2e (alef on Servo, headless X11)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        # The window scenarios (maximize, resize events) need a window manager; openbox is the smallest.
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" sh -c 'openbox >/dev/null 2>&1 & sleep 2; exec node tests/e2e/run.mjs --exe backend/target/debug/alef --timeout-s 150 --verbose'

      # The runner of Windows has no GPU: a window cannot get its graphics context there ("Cannot
      # create Servo graphics context: RequiredExtensionUnavailable"), so every scenario that opens a
      # window fails before the page runs. These are the scenarios that need none (the first run of the
      # whole set: 8 passed, 44 failed on exactly that). The rest follows once the quiet mode of the
      # runner renders on the software context that the windowless mode already uses on this runner.
      - name: e2e (alef on Servo, Windows, scenarios without a window)
        if: runner.os == 'Windows'
        timeout-minutes: 30
        run: node tests/e2e/run.mjs --exe backend/target/debug/alef.exe --timeout-s 150 --verbose --only console,service,service-signal,arguments,launch-modes,mcp-stdio,startup,manifest

      - name: Upload executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alef-${{ matrix.name }}
          path: backend/target/debug/${{ matrix.bin }}
          if-no-files-found: error

      - name: Upload frontend dist
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alef-frontend-dist
          path: frontend/dist
          if-no-files-found: error

      - name: sccache stats
        if: always()
        run: sccache --show-stats
