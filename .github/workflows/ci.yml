# Кроссплатформенный CI (docs/stages/m0-spikes.md, раздел «M0.4»). Действия закреплены по SHA
# (тег — в комментарии); компилятор закреплён версией. Поставка и аудит зависимостей — supply.yml.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: 'Run the full matrix'
        type: boolean
        default: false
      crates:
        description: 'Comma list of crates to test (overrides the plan)'
        type: string
        default: ''
      e2e:
        description: 'Comma list of e2e scenarios (overrides the plan)'
        type: string
        default: ''
  schedule:
    - cron: '37 2 * * *'   # nightly, full

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # scripts/cargo.mjs наследует окружение — sccache подхватывается и через npm-скрипты.
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  # Планировщик: считает, что прогонять; выходы — входы матрицы build-джоба.
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      full: ${{ steps.plan.outputs.full }}
      os: ${{ steps.plan.outputs.os }}
      matrix: ${{ steps.plan.outputs.matrix }}
      crates: ${{ steps.plan.outputs.crates }}
      crates_all: ${{ steps.plan.outputs.crates_all }}
      js: ${{ steps.plan.outputs.js }}
      js_all: ${{ steps.plan.outputs.js_all }}
      e2e: ${{ steps.plan.outputs.e2e }}
      docs_only: ${{ steps.plan.outputs.docs_only }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - id: plan
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          node scripts/ci/plan.mjs \
            --event "${{ github.event_name }}" \
            --ref "${{ github.ref }}" \
            --before "${{ github.event.before || github.event.pull_request.base.sha }}" \
            --after "${{ github.sha }}" \
            --full "${{ inputs.full == true }}" \
            --crates "${{ inputs.crates }}" \
            --e2e "${{ inputs.e2e }}"

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    needs: plan
    strategy:
      fail-fast: false
      # Матрица целиком приходит из плана (affected.json: platforms): полный прогон — 4 ОС, затронутый — ubuntu-24.04. Свой include здесь добавил бы все ОС снова.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      # Компилятор закреплён: «stable» менялся бы между запусками. Менять версию — осознанно,
      # одной правкой (и в supply.yml нижняя граница проверяется отдельно).
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch on 2026-10-11
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}
          components: rustfmt

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ matrix.name }}-${{ hashFiles('backend/Cargo.lock') }}

      # The build scripts (webrender shaders) write absolute paths of the checkout into backend/target: the key carries the repository name, or a renamed repository restores output that points at the old directory.
      - name: Cache backend/target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: backend/target
          key: cargo-target-${{ matrix.name }}-${{ github.event.repository.name }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            cargo-target-${{ matrix.name }}-${{ github.event.repository.name }}-

      - uses: mozilla-actions/sccache-action@054db53350805f83040bf3e6e9b8cf5a139aa7c9 # v0.0.7

      # The Actions cache service has outages (the first run died on `sccache: error: Server startup
      # failed`): the cache is an optimisation, so build with plain rustc when it cannot start.
      - name: sccache health check
        shell: bash
        run: |
          if ! sccache --start-server; then
            echo "::warning::sccache cannot start (cache service down); building without it"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi

      # Windows: MSVC/SDK — окружение через msvc-dev-cmd; LLVM — libclang для bindgen (mozjs_sys).
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows' && (needs.plan.outputs.crates_all == 'true' || needs.plan.outputs.crates != '' || needs.plan.outputs.e2e != 'none')

      - name: Servo build prerequisites (Windows)
        if: runner.os == 'Windows' && (needs.plan.outputs.crates_all == 'true' || needs.plan.outputs.crates != '' || needs.plan.outputs.e2e != 'none')
        shell: bash
        run: |
          # The Chocolatey community feed fails now and then: try again before giving up.
          for attempt in 1 2 3 4; do
            choco install --no-progress -y llvm cmake ninja && break
            [ "$attempt" = 4 ] && exit 1
            sleep $((attempt * 20))
          done

      - name: Servo build prerequisites (macOS)
        if: runner.os == 'macOS' && (needs.plan.outputs.crates_all == 'true' || needs.plan.outputs.crates != '' || needs.plan.outputs.e2e != 'none')
        run: |
          xcode-select -p
          brew install cmake ninja

      # Обоснование каждого пакета по крейтам — docs/stages/m0-results/ci.md.
      - name: Servo build prerequisites (Linux)
        if: runner.os == 'Linux' && (needs.plan.outputs.crates_all == 'true' || needs.plan.outputs.crates != '' || needs.plan.outputs.e2e != 'none')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev cmake ninja-build pkg-config \
            build-essential python3 curl git \
            libfontconfig1-dev libfreetype-dev \
            libglib2.0-dev \
            libgdk-pixbuf-2.0-dev \
            libx11-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libegl1-mesa-dev libgl1-mesa-dev \
            libx11-6 libxcb1 libxcursor1 libxrandr2 libxi6 \
            libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 \
            libegl1 libgl1 libglx-mesa0 libgl1-mesa-dri \
            libfontconfig1 libfreetype6 \
            xvfb openbox gdb
          # gdb attaches to a runtime the e2e runner started (a sibling, not a child, of gdb).
          sudo sysctl -w kernel.yama.ptrace_scope=0
          # A runtime gdb cannot attach to is made to write a core file instead: gdb reads it afterwards.
          sudo sysctl -w kernel.core_pattern=/tmp/alef-core.%p fs.suid_dumpable=2

      - name: npm ci
        run: npm ci

      - name: Lint (oxlint + структура)
        run: |
          npm run lint
          npm run lint:structure
          npm run test:structure
          node scripts/cargo.mjs fmt -- --check

      - name: Mutation harness tests
        run: npm run test:mutate

      # Unit-тесты собственных скриптов: планировщик и релиз (чистый node, без сборки).
      - name: Script tests (planner, release)
        run: |
          npm run test:ci
          npm run test:release
          npm run test:assets

      - name: Rust tests
        if: needs.plan.outputs.crates_all == 'true'
        run: npm run test:rust

      - name: Rust tests (affected crates)
        if: needs.plan.outputs.crates_all != 'true'
        run: node scripts/ci/test-crates.mjs "${{ needs.plan.outputs.crates }}"

      # Шаг ставит то, что фиче media-system нужно сверх Servo: заголовки ALSA для cpal;
      # путь v4l у nokhwa работает на чистых Rust-ioctl и системных пакетов не требует.
      # pkg-config уже ставится шагом предпосылок Servo, но повтор здесь безвреден и делает
      # шаг самодостаточным.
      - name: Media system prerequisites (Linux)
        if: runner.os == 'Linux' && (needs.plan.outputs.crates_all == 'true' || needs.plan.outputs.crates != '' || needs.plan.outputs.e2e != 'none')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config

      # M6.2: настоящие бэкенды камеры, микрофона и звука спрятаны за фичей; шаг собирает
      # фичу на каждой ОС матрицы. Юнит-тесты чистых частей идут обычным путём
      # `npm run test:rust` сборки по умолчанию — они компилируются без фичи.
      - name: Media system feature check
        if: needs.plan.outputs.crates_all == 'true' || needs.plan.outputs.crates != '' || needs.plan.outputs.e2e != 'none'
        run: node scripts/cargo.mjs check --locked -p alef-modules --features media-system

      # The system clipboard and trash against the real desktop of the clean runner. They change what
      # a user has, so the tests run only on request (ALEF_TEST_DESKTOP=1); Linux needs a display.
      # The default shell stays: Git Bash on Windows puts its own link.exe before the MSVC one.
      - name: Desktop backends (clipboard, trash, secrets)
        if: runner.os != 'Linux' && (needs.plan.outputs.crates_all == 'true' || contains(needs.plan.outputs.crates, 'alef-modules'))
        env:
          ALEF_TEST_DESKTOP: "1"
        run: node scripts/cargo.mjs test --locked -p alef-modules --test system --test desktop --test data -- --ignored --nocapture

      - name: Desktop backends (clipboard, trash; virtual display)
        if: runner.os == 'Linux' && (needs.plan.outputs.crates_all == 'true' || contains(needs.plan.outputs.crates, 'alef-modules'))
        env:
          ALEF_TEST_DESKTOP: "1"
        run: xvfb-run -a node scripts/cargo.mjs test --locked -p alef-modules --test system --test desktop -- --ignored --nocapture

      # The Secret Service needs a session bus and a keyring daemon with its default collection unlocked.
      - name: Desktop backends (secrets; keyring of a session)
        if: runner.os == 'Linux' && (needs.plan.outputs.crates_all == 'true' || contains(needs.plan.outputs.crates, 'alef-modules'))
        env:
          ALEF_TEST_DESKTOP: "1"
        run: |
          sudo apt-get install -y --no-install-recommends gnome-keyring
          dbus-run-session -- bash -c 'echo -n "alef-ci" | gnome-keyring-daemon --unlock --components=secrets > /dev/null && node scripts/cargo.mjs test --locked -p alef-modules --test data -- --ignored --nocapture'

      # The ts-rs export tests link alef-modules, which on Linux needs glib/gio/gdk-pixbuf (the icons
      # and the context menu). Runs that skip the Servo prerequisites above (a change of JS only) need
      # these too; a docs-only change cannot move the generated types and skips the step.
      - name: Types prerequisites (Linux)
        if: runner.os == 'Linux' && needs.plan.outputs.docs_only != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libglib2.0-dev libgdk-pixbuf-2.0-dev

      - name: Generated TypeScript types
        if: needs.plan.outputs.docs_only != 'true'
        run: |
          npm run check:types
          npm run test:types

      - name: Supply scripts have no install hooks
        run: node --test scripts/supply/check-no-hooks.test.mjs

      - name: "@alef-runtime/api tests"
        if: needs.plan.outputs.js == 'all' || contains(format(',{0},', needs.plan.outputs.js), ',packages/api,') || contains(format(',{0},', needs.plan.outputs.js), ',tests,')
        run: npm run test:api

      - name: "@alef-runtime/mcp tests"
        if: needs.plan.outputs.js == 'all' || contains(format(',{0},', needs.plan.outputs.js), ',packages/mcp,')
        run: npm run test:mcp

      - name: "@alef-runtime/tools tests"
        if: needs.plan.outputs.js == 'all' || contains(format(',{0},', needs.plan.outputs.js), ',packages/tools,')
        run: npm run test:tools

      # The real NSIS compiler against the generated installers (the bundle format nsis and the runtime
      # installer of the release): their scripts were only text-checked. The installers are never run.
      - name: NSIS installers compile (Linux)
        if: runner.os == 'Linux' && (needs.plan.outputs.js == 'all' || contains(format(',{0},', needs.plan.outputs.js), ',packages/tools,'))
        env:
          ALEF_TEST_MAKENSIS: "1"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nsis
          node --experimental-strip-types --test --test-name-pattern=makensis packages/tools/test/bundle.test.mjs scripts/release/tests/installer.test.mjs

      - name: NSIS installers compile (Windows)
        if: runner.os == 'Windows' && (needs.plan.outputs.js == 'all' || contains(format(',{0},', needs.plan.outputs.js), ',packages/tools,'))
        env:
          ALEF_TEST_MAKENSIS: "1"
          MAKENSIS: C:\Program Files (x86)\NSIS\makensis.exe
        shell: bash
        run: |
          # The Chocolatey community feed fails now and then ("Unable to resolve dependency 'nsis.install'"):
          # try again before giving up, and never go on without the compiler.
          for attempt in 1 2 3 4; do
            choco install --no-progress -y nsis && break
            [ "$attempt" = 4 ] && exit 1
            sleep $((attempt * 20))
          done
          test -f "$MAKENSIS"
          node --experimental-strip-types --test --test-name-pattern=makensis packages/tools/test/bundle.test.mjs scripts/release/tests/installer.test.mjs

      # The real hdiutil on a macOS runner: the dmg of the bundle is created, verified and mounted read-only.
      - name: Disk image (hdiutil)
        if: runner.os == 'macOS' && (needs.plan.outputs.js == 'all' || contains(format(',{0},', needs.plan.outputs.js), ',packages/tools,'))
        env:
          ALEF_TEST_HDIUTIL: "1"
        run: node --experimental-strip-types --test --test-name-pattern=hdiutil packages/tools/test/bundle.test.mjs

      - name: "create-alef-runtime tests"
        if: needs.plan.outputs.js == 'all' || contains(format(',{0},', needs.plan.outputs.js), ',packages/create-alef-runtime,')
        run: npm run test:create

      - name: "@alef-runtime/runtime tests"
        if: needs.plan.outputs.js == 'all' || contains(format(',{0},', needs.plan.outputs.js), ',packages/runtime,')
        run: npm run test:runtime

      # Typecheck ровно один раз — в сборке на Linux (npm run typecheck).
      - name: Build (Rust)
        if: runner.os == 'macOS' && (needs.plan.outputs.crates_all == 'true' || needs.plan.outputs.crates != '' || needs.plan.outputs.e2e != 'none')
        run: node scripts/cargo.mjs build --locked --workspace --features alef/e2e

      # Windows builds ANGLE and copies its DLLs next to the exe; product default stays WGL.
      - name: Build (Rust; ANGLE)
        id: build_windows_angle
        if: runner.os == 'Windows' && (needs.plan.outputs.crates_all == 'true' || needs.plan.outputs.crates != '' || needs.plan.outputs.e2e != 'none')
        shell: pwsh
        run: |
          $messages = @(node scripts/cargo.mjs build --locked --workspace --features alef/e2e,alef/angle --message-format=json-render-diagnostics)
          if ($LASTEXITCODE -ne 0) { throw "Cargo ANGLE build failed with exit code $LASTEXITCODE" }
          $outDirs = @($messages | ForEach-Object { $_ | ConvertFrom-Json -ErrorAction Stop } |
            Where-Object { $_.reason -eq 'build-script-executed' -and $_.package_id -match 'mozangle@0\.5\.1$' } |
            Select-Object -ExpandProperty out_dir -Unique)
          if ($outDirs.Count -ne 1) { throw "Expected exactly one mozangle 0.5.1 Cargo out_dir; found $($outDirs.Count)" }
          foreach ($dll in @('libEGL.dll', 'libGLESv2.dll')) {
            $source = Join-Path $outDirs[0] $dll
            if (!(Test-Path -LiteralPath $source -PathType Leaf)) { throw "Missing ANGLE DLL: $source" }
            Copy-Item -LiteralPath $source -Destination 'backend/target/debug' -ErrorAction Stop
          }

      - name: Build (typecheck + Rust)
        if: runner.os == 'Linux' && (needs.plan.outputs.crates_all == 'true' || needs.plan.outputs.crates != '' || needs.plan.outputs.e2e != 'none')
        run: |
          npm run typecheck
          node scripts/cargo.mjs build --locked --workspace --features alef/e2e

      - name: Release build without test hooks (Linux)
        # Only the crates that carry test hooks (alef, alef-runtime, alef-modules) can leak them into a
        # release build; the full run before every merge covers the rest.
        if: runner.os == 'Linux' && (needs.plan.outputs.full == 'true' || contains(format(',{0},', needs.plan.outputs.crates), ',alef,') || contains(format(',{0},', needs.plan.outputs.crates), ',alef-runtime,') || contains(format(',{0},', needs.plan.outputs.crates), ',alef-modules,'))
        run: |
          node scripts/cargo.mjs build --locked -p alef --release
          node scripts/supply/check-no-hooks.mjs backend/target/release/alef

      # tests/e2e: the real alef binary on scenario applications; Servo renders through Mesa software GL.
      - name: e2e (alef on Servo, headless X11)
        if: runner.os == 'Linux' && needs.plan.outputs.e2e != 'none'
        timeout-minutes: 30
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        # The window scenarios (maximize, resize events) need a window manager; openbox is the smallest.
        run: |
          only=""
          if [ "${{ needs.plan.outputs.e2e }}" != "all" ]; then
            only="--only ${{ needs.plan.outputs.e2e }}"
          fi
          ulimit -c unlimited
          xvfb-run -a -s "-screen 0 1280x1024x24" sh -c "openbox >/dev/null 2>&1 & sleep 2; exec node tests/e2e/run.mjs --exe backend/target/debug/alef --timeout-s 150 --verbose $only"

      # WGL on a GPUless Windows runner cannot create a context (#107, #116): only the no-window
      # scenarios run unconditionally; the windowed groups run after a successful ANGLE build.
      # The helper intersects the plan with the group and exits 0 when the intersection is empty.
      - name: e2e (alef on Servo, Windows, scenarios without a window)
        if: runner.os == 'Windows'
        timeout-minutes: 30
        shell: bash
        run: node scripts/ci/e2e/group.mjs --plan "${{ needs.plan.outputs.e2e }}" --group "console,service,service-signal,arguments,launch-modes,mcp-stdio,startup,startup-timing,warm,manifest" --exe backend/target/debug/alef.exe --timeout-s 150

      # Independent groups run even when an earlier group fails (#117).
      - name: "e2e (alef on Servo, Windows, window: core)"
        if: runner.os == 'Windows' && !cancelled() && steps.build_windows_angle.outcome == 'success' && needs.plan.outputs.e2e != 'none'
        timeout-minutes: 30
        shell: bash
        run: node scripts/ci/e2e/group.mjs --plan "${{ needs.plan.outputs.e2e }}" --group "core" --exe backend/target/debug/alef.exe --timeout-s 150

      - name: "e2e (alef on Servo, Windows, window: window)"
        if: runner.os == 'Windows' && !cancelled() && steps.build_windows_angle.outcome == 'success' && needs.plan.outputs.e2e != 'none'
        timeout-minutes: 30
        shell: bash
        run: node scripts/ci/e2e/group.mjs --plan "${{ needs.plan.outputs.e2e }}" --group "window" --exe backend/target/debug/alef.exe --timeout-s 150

      - name: "e2e (alef on Servo, Windows, window: csp)"
        if: runner.os == 'Windows' && !cancelled() && steps.build_windows_angle.outcome == 'success' && needs.plan.outputs.e2e != 'none'
        timeout-minutes: 30
        shell: bash
        run: node scripts/ci/e2e/group.mjs --plan "${{ needs.plan.outputs.e2e }}" --group "csp" --exe backend/target/debug/alef.exe --timeout-s 150

      - name: "e2e (alef on Servo, Windows, window: permissions)"
        if: runner.os == 'Windows' && !cancelled() && steps.build_windows_angle.outcome == 'success' && needs.plan.outputs.e2e != 'none'
        timeout-minutes: 30
        shell: bash
        run: node scripts/ci/e2e/group.mjs --plan "${{ needs.plan.outputs.e2e }}" --group "permissions" --exe backend/target/debug/alef.exe --timeout-s 150

      - name: "e2e (alef on Servo, Windows, transport/development: induced, dev)"
        if: runner.os == 'Windows' && !cancelled() && steps.build_windows_angle.outcome == 'success' && needs.plan.outputs.e2e != 'none'
        timeout-minutes: 30
        shell: bash
        run: node scripts/ci/e2e/group.mjs --plan "${{ needs.plan.outputs.e2e }}" --group "induced,dev" --exe backend/target/debug/alef.exe --timeout-s 150

      - name: "e2e (alef on Servo, Windows, consent: decisions)"
        if: runner.os == 'Windows' && !cancelled() && steps.build_windows_angle.outcome == 'success' && needs.plan.outputs.e2e != 'none'
        timeout-minutes: 30
        shell: bash
        run: node scripts/ci/e2e/group.mjs --plan "${{ needs.plan.outputs.e2e }}" --group "consent,narrowing,ask,cancel,decisions" --exe backend/target/debug/alef.exe --timeout-s 150

      - name: "e2e (alef on Servo, Windows, apps UI)"
        if: runner.os == 'Windows' && !cancelled() && steps.build_windows_angle.outcome == 'success' && needs.plan.outputs.e2e != 'none'
        timeout-minutes: 30
        shell: bash
        run: node scripts/ci/e2e/group.mjs --plan "${{ needs.plan.outputs.e2e }}" --group "apps-ui" --exe backend/target/debug/alef.exe --timeout-s 150

      - name: "e2e (alef on Servo, Windows, lifecycle/integration: app)"
        if: runner.os == 'Windows' && !cancelled() && steps.build_windows_angle.outcome == 'success' && needs.plan.outputs.e2e != 'none'
        timeout-minutes: 30
        shell: bash
        run: node scripts/ci/e2e/group.mjs --plan "${{ needs.plan.outputs.e2e }}" --group "app,quit,relaunch,instance,restore,autostart,deeplink,devflow,devtools" --exe backend/target/debug/alef.exe --timeout-s 150

      - name: "e2e (alef on Servo, Windows, desktop/system/processes: modules)"
        if: runner.os == 'Windows' && !cancelled() && steps.build_windows_angle.outcome == 'success' && needs.plan.outputs.e2e != 'none'
        timeout-minutes: 30
        shell: bash
        run: node scripts/ci/e2e/group.mjs --plan "${{ needs.plan.outputs.e2e }}" --group "system,desktop,menu,context-menu,tray,shortcut,shortcut-denied,shortcut-substitute,cli,cli-substitute,cli-commands" --exe backend/target/debug/alef.exe --timeout-s 150

      - name: "e2e (alef on Servo, Windows, data: modules)"
        if: runner.os == 'Windows' && !cancelled() && steps.build_windows_angle.outcome == 'success' && needs.plan.outputs.e2e != 'none'
        timeout-minutes: 30
        shell: bash
        run: node scripts/ci/e2e/group.mjs --plan "${{ needs.plan.outputs.e2e }}" --group "fs,fs-substitute,sqlite,sqlite-substitute,store,log,crypto,webcrypto,secrets,secrets-substitute,secrets-denied" --exe backend/target/debug/alef.exe --timeout-s 150

      - name: "e2e (alef on Servo, Windows, network/MCP: modules)"
        if: runner.os == 'Windows' && !cancelled() && steps.build_windows_angle.outcome == 'success' && needs.plan.outputs.e2e != 'none'
        timeout-minutes: 30
        shell: bash
        run: node scripts/ci/e2e/group.mjs --plan "${{ needs.plan.outputs.e2e }}" --group "http,http-substitute,socket,socket-substitute,websocket,websocket-substitute,serve,serve-substitute,mcp,ai,ai-threat,media" --exe backend/target/debug/alef.exe --timeout-s 150

      - name: "e2e (alef on Servo, Windows, origin/packaging extras)"
        if: runner.os == 'Windows' && !cancelled() && steps.build_windows_angle.outcome == 'success' && needs.plan.outputs.e2e != 'none'
        timeout-minutes: 30
        shell: bash
        run: node scripts/ci/e2e/group.mjs --plan "${{ needs.plan.outputs.e2e }}" --group "origin,webcrypto-undeclared,webcrypto-substitute,package,updater" --exe backend/target/debug/alef.exe --timeout-s 150

      # macOS has a WindowServer, so every canonical group runs like on a developer machine
      # (quiet mode is the default outside Linux); skips are declared in the scenarios themselves
      # (startup: Win32 probe; menu/tray on Linux: product reports unavailability). One step runs
      # every group of scripts/ci/e2e/groups.mjs; a failed group does not hide the others (#117).
      # The bound is the sum of the per-group deadlines (62 scenarios x 150 s + 12 groups x 2 min
      # margin = 179 min, rounded up): a worst-case ceiling where every scenario hangs to its
      # limit, not an expectation (the observed full Linux e2e is minutes).
      - name: e2e (alef on Servo, macOS, canonical groups)
        if: runner.os == 'macOS' && needs.plan.outputs.e2e != 'none'
        timeout-minutes: 180
        shell: bash
        run: node scripts/ci/e2e/os.mjs --plan "${{ needs.plan.outputs.e2e }}" --exe backend/target/debug/alef --timeout-s 150

      - name: Upload executable
        if: runner.os != 'Windows' && (needs.plan.outputs.crates_all == 'true' || needs.plan.outputs.crates != '' || needs.plan.outputs.e2e != 'none')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alef-${{ matrix.name }}
          path: backend/target/debug/${{ matrix.bin }}
          if-no-files-found: error

      - name: Upload executable and ANGLE DLLs (Windows)
        if: runner.os == 'Windows' && (needs.plan.outputs.crates_all == 'true' || needs.plan.outputs.crates != '' || needs.plan.outputs.e2e != 'none')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alef-${{ matrix.name }}
          path: |
            backend/target/debug/alef.exe
            backend/target/debug/libEGL.dll
            backend/target/debug/libGLESv2.dll
          if-no-files-found: error

      - name: sccache stats
        if: always()
        run: sccache --show-stats
