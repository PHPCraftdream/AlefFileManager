# Мутационное тестирование (docs/stages/m0-results/ci.md). Действия закреплены по SHA
# (тег — в комментарии); компилятор закреплён версией. Одна компиляция на мутацию, поэтому работа идёт в CI.
name: Mutation

on:
  workflow_dispatch:
    inputs:
      list:
        description: Имя списка мутаций (scripts/quality/mutations/<list>.json)
        type: string
        default: archive

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  mutate:
    name: shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # Одна компиляция на мутацию, поэтому работа идёт в CI, не локально.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch on 2026-10-11
        with:
          toolchain: 1.99.0
      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-linux-x64-${{ hashFiles('backend/Cargo.lock') }}
      # The build scripts (webrender shaders) write absolute paths of the checkout into backend/target: the key carries the repository name, or a renamed repository restores output that points at the old directory.
      - name: Cache backend/target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: backend/target
          key: cargo-target-linux-x64-${{ github.event.repository.name }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            cargo-target-linux-x64-${{ github.event.repository.name }}-
      - uses: mozilla-actions/sccache-action@054db53350805f83040bf3e6e9b8cf5a139aa7c9 # v0.0.7
      - name: sccache health check
        shell: bash
        run: |
          if ! sccache --start-server; then
            echo "::warning::sccache cannot start (cache service down); building without it"
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi
      - name: Servo build prerequisites (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev cmake ninja-build pkg-config \
            build-essential python3 curl git \
            libfontconfig1-dev libfreetype-dev \
            libglib2.0-dev \
            libgdk-pixbuf-2.0-dev \
            libx11-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libegl1-mesa-dev libgl1-mesa-dev \
            libx11-6 libxcb1 libxcursor1 libxrandr2 libxi6 \
            libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 \
            libegl1 libgl1 libglx-mesa0 libgl1-mesa-dri \
            libfontconfig1 libfreetype6 \
            xvfb openbox
      - name: npm ci
        run: npm ci
      - name: Mutation shard
        run: node scripts/quality/mutate.mjs "${{ inputs.list || 'archive' }}" --shard ${{ matrix.shard }}/4
