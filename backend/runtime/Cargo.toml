[package]
name = "alef-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
servo = "=0.6.0"
winit = "=0.30.13"
euclid = "=0.22.14"
url = "=2.5.8"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "fs", "sync", "time", "macros"] }
getrandom = "=0.4.3"
subtle = "=2.6.1"
fjall = "=3.1.10"
mime_guess = "=2.0.5"
http = "=1.5.0"
futures-util = "=0.3.34"
ipc-channel = { version = "=0.22.0", features = ["async", "force-inprocess"] }
servo-net-traits = "=0.6.0"

[dev-dependencies]
tempfile = "=3.27.0"
