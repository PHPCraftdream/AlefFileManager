[package]
name = "alef-modules"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
alef-core = { path = "../alef-core" }
bytes = "=1.12.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt", "sync", "time", "net", "io-util"] }
ts-rs = { version = "=12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
gethostname = "=1.1.0"
sys-locale = "=0.3.2"
arboard = "=3.6.1"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
opener = "=0.9.0"
trash = "=5.2.9"
tempfile = "=3.27.0"

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "test-util"] }
