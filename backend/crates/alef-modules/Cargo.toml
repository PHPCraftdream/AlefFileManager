[package]
name = "alef-modules"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
alef-core = { path = "../alef-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt"] }
ts-rs = { version = "=12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
gethostname = "=1.1.0"
sys-locale = "=0.3.2"

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros"] }
