[package]
name = "alef-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
alef-core = { path = "../alef-core" }
alef-package = { path = "../alef-package" }
bytes = "=1.12.1"
servo = { version = "=0.6.0", features = ["webcrypto"] }
winit = "=0.30.13"
euclid = "=0.22.14"
url = "=2.5.8"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "fs", "sync", "time", "macros"] }
getrandom = "=0.4.3"
fjall = "=3.1.10"
mime_guess = "=2.0.5"
http = "=1.5.0"
futures-util = "=0.3.34"
ipc-channel = { version = "=0.22.0", features = ["async", "force-inprocess"] }
servo-net-traits = "=0.6.0"
servo-net = "=0.6.0"
servo-embedder-traits = "=0.6.0"
servo-base = "=0.6.0"
rfd = "=0.17.2"

# M0.3 spike (docs/stages/m0-spikes.md): off by default, enabled with --features spike-integration.
global-hotkey = "=0.8.0"
crossbeam-channel = "=0.5.17"

# Native menus: muda needs GTK on Linux, which a winit loop does not own, so only here.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
muda = "=0.19.3"
tray-icon = "=0.24.2"

# Linux tray: StatusNotifierItem + DBusMenu over D-Bus (no GTK); the same zbus as
# alef-modules, and async-io to drive its futures on the tray worker thread.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }
async-io = "=2.6.0"

# Opt-in backend selection leaves default Windows builds on WGL.
[target.'cfg(windows)'.dependencies]
mozangle = { version = "=0.5.1", optional = true }
surfman = { version = "=0.13.0", optional = true, features = ["sm-angle-default", "sm-angle-builtin"] }

[features]
e2e = ["alef-core/e2e"]
angle = ["dep:surfman", "dep:mozangle"]
spike-origin = []
spike-integration = []

[dev-dependencies]
tempfile = "=3.27.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.52.0", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
