[package]
name = "alef"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "alef_launch"
path = "src/lib.rs"

[[bin]]
name = "alef"
path = "src/main.rs"

[dependencies]
alef-core = { path = "../alef-core" }
alef-modules = { path = "../alef-modules" }
alef-runtime = { path = "../alef-runtime" }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "fs", "macros"] }
url = "=2.5.8"
rustls = "=0.23.45"
surfman = "=0.13.0"
dirs = "=6.0.0"

[dev-dependencies]
tempfile = "=3.27.0"
