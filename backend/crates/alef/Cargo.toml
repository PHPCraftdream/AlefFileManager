[package]
name = "alef"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "alef_launch"
path = "src/lib.rs"

[[bin]]
name = "alef"
path = "src/main.rs"

[features]
e2e = ["alef-runtime/e2e", "alef-modules/e2e"]
spike-origin = ["alef-runtime/spike-origin"]

[dependencies]
alef-core = { path = "../alef-core" }
alef-modules = { path = "../alef-modules" }
alef-package = { path = "../alef-package" }
alef-runtime = { path = "../alef-runtime" }
sha2 = "=0.10.9"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "fs", "macros", "time", "signal", "sync"] }
url = "=2.5.8"
rustls = "=0.23.45"
surfman = "=0.13.0"
dirs = "=6.0.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Registry", "Win32_Security_Authorization"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[dev-dependencies]
base64 = "=0.22.1"
crc32fast = "=1.5.2"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
tempfile = "=3.27.0"
