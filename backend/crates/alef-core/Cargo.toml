[package]
name = "alef-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[features]
e2e = []

[dependencies]
bytes = "=1.12.1"
ktav = "=0.8.0"
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tokio = { version = "=1.53.1", features = ["rt", "sync", "time", "macros"] }
ts-rs = { version = "=12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["rt-multi-thread"] }
