[package]
name = "alef-file-manager"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-or-later"
publish = false

[workspace]
members = ["runtime"]
exclude = ["patches/winit"]
resolver = "2"

[dependencies]
alef-runtime = { path = "runtime" }
url = "=2.5.8"
rustls = "=0.23.45"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "fs", "sync", "macros"] }
surfman = "=0.13.0"
dirs = "=6.0.0"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.dev]
debug = 0

[patch.crates-io]
servo-paint-api = { path = "patches/servo-paint-api" }
winit = { path = "patches/winit" }
