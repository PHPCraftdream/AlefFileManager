[workspace]
members = ["crates/alef-core", "crates/alef-modules", "crates/alef-runtime", "crates/alef", "crates/alef-package", "crates/alef-broker"]
exclude = ["patches/winit"]
resolver = "2"

[profile.dev]
debug = 0

# Release-only profile for the release workflow (docs/stages/m7-distribution.md).
[profile.dist]
inherits = "release"
strip = "symbols"
lto = "thin"

[patch.crates-io]
servo-paint = { path = "patches/servo-paint" }
servo-paint-api = { path = "patches/servo-paint-api" }
winit = { path = "patches/winit" }
surfman = { path = "patches/surfman" }
